name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tool tests
        run: uv run pytest tests
      - name: Plugin tests
        run: |
          status=0
          for plugin in plugins/*/; do
            if [ -d "${plugin}tests" ]; then
              echo "::group::${plugin}"
              uv run pytest "${plugin}" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status
      - name: Check versions
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          uv run python tools/check_versions.py "origin/${{ github.base_ref }}"
      - name: Pack
        run: uv run python tools/pack_all.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.deckerplugin
