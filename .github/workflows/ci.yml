name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tool tests
        run: uv run pytest tests
      - name: Plugin tests
        run: |
          status=0
          for plugin in plugins/*/; do
            if [ -d "${plugin}tests" ]; then
              echo "::group::${plugin}"
              uv run pytest "${plugin}" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status
      - name: Check versions
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          uv run python -m tools.check_versions "origin/$BASE_REF"
      - name: Pack
        run: uv run python -m tools.pack_all --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.deckerplugin
