name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check versions (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          uv run python -m tools.check_versions "origin/$BASE_REF"
      - name: Check versions (push to main)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # An unbumped change pushed straight to main is never republished, so fail loudly here.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            uv run python -m tools.check_versions "$BEFORE"
          else
            echo "no previous commit to compare against, skipping"
          fi
      - name: Pack
        run: uv run python -m tools.pack_all --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.deckerplugin

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-cairo
      - if: runner.os == 'Windows'
        run: echo "${{ steps.msys.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"
        shell: bash
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Tool tests
        run: uv run pytest -rs tests
      - name: Plugin tests
        shell: bash
        run: |
          status=0
          for plugin in plugins/*/; do
            if [ -d "${plugin}tests" ]; then
              echo "::group::${plugin}"
              uv run pytest -rs "${plugin}" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status
