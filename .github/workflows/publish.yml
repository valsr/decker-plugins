name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Pack all plugins
        run: uv run python tools/pack_all.py --out dist
      - name: Create releases for versions that have none (existing releases are never touched)
        run: |
          for package in dist/*.deckerplugin; do
            name="$(basename "$package" .deckerplugin)"   # <id>-<version>
            version="${name##*-}"
            plugin_id="${name%-*}"
            tag="${plugin_id}-v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag exists, skipping"
              continue
            fi
            uv run python tools/release_meta.py "$package"
            gh release create "$tag" "$package" "${package}.json" \
              --target "$GITHUB_SHA" --title "$plugin_id $version" --notes "Release of $plugin_id $version."
          done
      - name: Download every release sidecar
        run: |
          mkdir -p sidecars
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            gh release download "$tag" --pattern '*.json' --dir "sidecars/$tag" \
              || echo "release $tag has no sidecar, ignoring it"
          done
      - name: Build the site
        run: uv run python tools/build_index.py --sidecars sidecars --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
