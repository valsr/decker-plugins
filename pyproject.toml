[project]
name = "decker-plugins"
version = "0.1.0"
description = "Plugins for Decker and the tooling that packages and publishes them"
requires-python = ">=3.14"
dependencies = [
    "decker @ git+https://github.com/valsr/decker.git@9c2ee9b01306fc03f609347512962f226124548c",
    "packaging>=24",
]

[dependency-groups]
dev = ["pytest>=8", "assertpy>=1.1", "pyyaml>=6", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "plugins"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[[tool.uv.index]]
# Lock against PyPI so CI (and anyone else) can resolve the lockfile.
url = "https://pypi.org/simple"
default = true
